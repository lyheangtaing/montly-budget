name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build Android
        run: ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-budget-android
          path: composeApp/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build iOS simulator app
        run: xcodebuild -project iosApp/iosApp.xcodeproj -scheme MonthlyBudget -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
